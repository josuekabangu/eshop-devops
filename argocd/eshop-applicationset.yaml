# argocd/eshop-applicationset.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: eshop
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/josuekabangu/eshop-devops.git
        revision: main
        directories:
          - path: helm/*
  template:
    metadata:
      name: "{{path.basename}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/josuekabangu/eshop-devops.git
        targetRevision: main
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true         # supprime les ressources retirées du chart
          selfHeal: true      # corrige automatiquement toute dérive manuelle (kubectl edit, etc.)
