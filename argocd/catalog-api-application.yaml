# argocd/catalog-api-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/josuekabangu/eshop-devops.git
    targetRevision: main
    path: helm/catalog-api
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true       # supprime les ressources retirées du chart
      selfHeal: true     # corrige automatiquement toute dérive manuelle (kubectl edit, etc.)
