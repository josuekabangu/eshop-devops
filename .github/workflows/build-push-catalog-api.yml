# .github/workflow/build-push-catalog-api.yml
name: Build and Push catalog-api

on:
  push:
    branches: [main]
    paths:
      - 'src/Catalog.API/**'
      - 'src/Shared/**'
      - 'Directory.Prackages.props'
      - 'Directory.Build.props'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/catalog-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest 
    permissions:
      contents: read
      packages: write      # ← nécessaire pour pousser vers ghcr.io

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # ← généré automatiquement, rien à créer

      - name: Build and push image 
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Catalog.API/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
  
