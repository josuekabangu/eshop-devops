image:
  repository: ghcr.io/josuekabangu/identity-api
  tag: latest

replicaCount: 1

postgres:
  host: postgres
  port: 5432
  database: identitydb
  username: postgres
  password: Changeme

externalHost: "192.168.56.11"

clients:
  webapp: "5100"
  webhooksWeb: "5114"
  basketApi: "5103"
  orderingApi: "5104"
  webhooksApi: "5110"

service:
  externalPort: 5223

resources:
  requests:
    cpu: 100m 
    memory: 256Mi 
  limits:
    cpu: 500m 
    memory: 512Mi

probes:
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20