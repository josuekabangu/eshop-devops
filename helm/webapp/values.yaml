# values.yaml
image:
  repository: ghcr.io/josuekabangu/webapp
  tag: latest

replicaCount: 1

rabbitmq:
  host: rabbitmq
  port: 5672
  username: eshop_rabbit
  password: password

externalHost: "192.168.56.11"

identity:
  externalPort: "5223"

service:
  externalPort: 5100

internalServices:
  catalogApi: "http://catalog-api:8080"
  orderingApi: "http://ordering-api:8080"
  basketApi: "http://basket-api:8080"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20
