apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      template:
        spec:
          imagePullSecrets:
            - name: ghcr-secret 
      containers:
        - name: catalog-api
          image: ghcr.io/<ton-username>/catalog-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__catalogdb
              valueFrom:
                secretKeyRef:
                  name: catalog-api-secrets
                  key: ConnectionStrings__catalogdb
            - name: ConnectionStrings__eventbus
              valueFrom:
                secretKeyRef:
                  name: catalog-api-secrets
                  key: ConnectionStrings__eventbus
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"