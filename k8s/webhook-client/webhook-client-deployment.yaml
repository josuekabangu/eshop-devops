apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-client
  template:
    metadata:
      labels:
        app: webhook-client
    spec:
      containers:
        - name: webhook-client
          image: localhost:5000/webhook-client:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: webhook-client-config
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
