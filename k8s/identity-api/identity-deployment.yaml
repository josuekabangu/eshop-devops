apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
    spec:
      containers:
        - name: identity-api
          image: localhost:5000/identity-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: identity-api-config
          env:
            - name: ConnectionStrings__identitydb
              valueFrom:
                secretKeyRef:
                  name: identity-api-secrets
                  key: ConnectionStrings__identitydb
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
