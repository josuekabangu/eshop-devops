apiVersion: apps/v1
kind: Deployment
metadata:
  name: basket-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: basket-api
  template:
    metadata:
      labels:
        app: basket-api
    spec:
      containers:
        - name: basket-api
          image: localhost:5000/basket-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: basket-api-config
          env:
            - name: ConnectionStrings__redis
              valueFrom:
                secretKeyRef:
                  name: basket-api-secrets
                  key: ConnectionStrings__redis
            - name: ConnectionStrings__eventbus
              valueFrom:
                secretKeyRef:
                  name: basket-api-secrets
                  key: ConnectionStrings__eventbus
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
